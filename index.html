<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copenhagen Records</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    main {
      width: min(760px, 100%);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2.2rem, 6vw, 4.4rem);
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 700;
    }
    .established {
      margin: 26px 0 42px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    .rule {
      width: 70px;
      height: 1px;
      background: #111;
      margin: 0 auto 42px;
    }
    p {
      margin: 0 auto 26px;
      max-width: 650px;
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      line-height: 1.7;
    }
    em { font-style: italic; }
  </style>
</head>
<body>
  <main>
    <h1>COPENHAGEN RECORDS</h1>
    <div class="established">Established in 2004</div>
    <div class="rule"></div>

    <p>Copenhagen Records was a Danish record label founded in 2004.</p>

    <p>Among the label's first releases was Nephew's <em>USADSB</em>, released in 2004.</p>
  </main>
</body>
</html>
